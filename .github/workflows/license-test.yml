name: Payment gate test

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  server-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: server

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Start the license server (test mode)
        run: |
          mkdir -p test-output
          cd server
          ADMIN_TOKEN=ci-admin DATA_FILE=../test-output/server-data.json nohup node src/node-server.js </dev/null > ../test-output/server.log 2>&1 &
          echo $! > ../test-output/server.pid
          sleep 2; curl -sf http://localhost:8787/health
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run payment gate test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: playstore
          arch: x86_64
          profile: pixel_6
          # More memory and cores than the default, so the system doesn't stall
          # ("System UI isn't responding") on the shared CI machine.
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/license-test.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload logs and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-test
          path: test-output/
