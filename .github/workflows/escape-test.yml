name: Escape test

# Tries to get around the lock: boot window on a slow phone, system popups, links into
# Settings / browsers / the Play Store, from new windows and from inside an allowed app.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  escape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug :testapps:escapeprobe:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run escape test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: playstore
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/escape-test.sh app/build/outputs/apk/debug/app-debug.apk testapps/escapeprobe/build/outputs/apk/debug/escapeprobe-debug.apk
      - name: Upload screenshots, video and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escape-test
          path: test-output/
