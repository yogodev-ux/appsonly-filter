name: Windows installer

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Unit tests + the APKs the other jobs need.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Installer unit tests and jar
        run: ./gradlew --no-daemon -p installer test fatJar
      - name: Build app and test-account APKs
        run: ./gradlew --no-daemon :app:assembleDebug :testapps:fakeaccount:assembleDebug
      # The app customers get: a release build signed with the real key. The key and the
      # license settings live only in the repository's secrets, never in the code. Without
      # them (forks, or before the key exists) no customer installer is made.
      - name: Build release app (only when the release secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
          LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$LICENSE_PUBLIC_KEY" ] || [ -z "$LICENSE_SERVER" ]; then
            echo "No release secrets: skipping the customer build (the test build is still tested)."
            exit 0
          fi
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$RELEASE_KEYSTORE_FILE"
          ./gradlew --no-daemon :app:assembleRelease -PlicensePublicKey="$LICENSE_PUBLIC_KEY" -PlicenseServer="$LICENSE_SERVER"
          rm -f "$RELEASE_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-inputs
          path: |
            installer/build/libs/apps-only-setup.jar
            app/build/outputs/apk/debug/app-debug.apk
            testapps/fakeaccount/build/outputs/apk/debug/fakeaccount-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

  # The setup engine against a real (emulated) phone that already has an account.
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: installer-inputs
          path: inputs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run installer test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: playstore
          arch: x86_64
          profile: pixel_6
          # Same as the other emulator jobs: on the default 2 GB emulator adb drops right
          # after boot on the shared CI machine ("error: closed" before the test starts).
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/installer-test.sh inputs/app/build/outputs/apk/debug/app-debug.apk inputs/testapps/fakeaccount/build/outputs/apk/debug/fakeaccount-debug.apk inputs/installer/build/libs/apps-only-setup.jar
      - name: Upload logs and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test
          path: test-output/

  # The Windows package: AppsOnlySetup.exe with its own Java, adb, and the app inside.
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: installer-inputs
          path: inputs
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force jp | Out-Null
          Copy-Item inputs/installer/build/libs/apps-only-setup.jar jp/
          # A second, console launcher for support staff and for the smoke test below.
          Set-Content cli.properties "win-console=true`narguments=--cli"
          jpackage --type app-image --name AppsOnlySetup --input jp --main-jar apps-only-setup.jar `
            --main-class com.appsonly.installer.MainKt --app-version 0.1.0 --vendor "Apps Only" --dest dist `
            --add-launcher AppsOnlySetupCli=cli.properties
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath dist/AppsOnlySetup
          # Only the signed release app ever goes in the customer installer. The test build
          # has developer controls and can be unlocked from a computer.
          $release = "inputs/app/build/outputs/apk/release/app-release.apk"
          if (Test-Path $release) {
            Copy-Item $release dist/AppsOnlySetup/apps-only.apk
            "HAS_APP=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Output "No signed release app (release secrets not set): the package is tested but not uploaded."
          }
          Get-ChildItem dist/AppsOnlySetup
      - name: Smoke test (no phone connected)
        shell: pwsh
        run: |
          $out = & dist/AppsOnlySetup/AppsOnlySetupCli.exe --check 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "No phone found") { throw "installer did not run correctly on Windows" }
          if (-not (Test-Path dist/AppsOnlySetup/AppsOnlySetup.exe)) { throw "exe missing" }
          # --check exits 1 when no phone is connected; that is the expected result here.
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        if: env.HAS_APP == '1'
        with:
          name: AppsOnlySetup-windows
          path: dist/
